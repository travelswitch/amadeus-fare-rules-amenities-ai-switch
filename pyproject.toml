[project]
name = "amadeus-fare-rules-amenities-ai-switch"
version = "1.0.0"
description = "Amadeus NDC Fare Rules & Amenities AI Switch: open-source API that turns Amadeus NDC fare rules and fare-family amenities into traveller-friendly summaries, amenity cards, fare names and Q&A chat with your own LLM."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "TravelSwitch" }]
keywords = ["amadeus", "ndc", "airline", "fare-rules", "amenities", "travel", "llm", "fastapi"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: FastAPI",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "asyncpg>=0.29,<1",
  "redis>=5.0,<7",
  "cryptography>=42",
  "bcrypt>=4.1,<5",
  "PyJWT>=2.8,<3",
  "openai>=1.40,<3",
  "anthropic>=0.40",
  "google-genai>=1.0,<2",
  "boto3>=1.34,<2",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/travelswitch/amadeus-fare-rules-amenities-ai-switch"
Issues = "https://github.com/travelswitch/amadeus-fare-rules-amenities-ai-switch/issues"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["farelens*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]  # B008: FastAPI's Depends() in defaults is idiomatic
